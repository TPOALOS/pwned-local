[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pwned-local"
version = "1.0.0"
description = "Check passwords or SHA-1 hashes against a local Have I Been Pwned style sorted hash file using binary search. Never touches the network. No dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "TPOALOS"}]
keywords = ["passwords", "hibp", "pwned", "security", "offline"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/TPOALOS/pwned-local"

[project.scripts]
pwned-local = "pwned_local:main"

[tool.setuptools]
py-modules = ["pwned_local"]
